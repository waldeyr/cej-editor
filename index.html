<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEJ-PAGE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">

<link rel="stylesheet" href="css/editor.css">
<script src="vendor/lucide.min.js" defer></script>
<!-- Importmap for the lazily-loaded ESM modules. Everything is vendored
     under vendor/ so the editor works with no network at all: on a locked-
     down corporate machine, and inside the Windows executable, which embeds
     this whole directory. No SRI needed — these are same-origin files. -->
<script type="importmap">
{
  "imports": {
    "codemirror":                  "./vendor/esm/codemirror_6.0.1_es2022_codemirror.bundle.mjs",
    "@codemirror/lang-html":       "./vendor/esm/_codemirror_lang-html_6.4.9_es2022_lang-html.bundle.mjs",
    "@codemirror/theme-one-dark":  "./vendor/esm/_codemirror_theme-one-dark_6.1.2_es2022_theme-one-dark.bundle.mjs",
    "@codemirror/state":           "./vendor/esm/_codemirror_state_6.4.1_es2022_state.bundle.mjs",
    "@codemirror/view":            "./vendor/esm/_codemirror_view_6.26.3_es2022_view.bundle.mjs",
    "diff":                        "./vendor/esm/diff_5.2.0_es2022_diff.bundle.mjs",
    "isomorphic-git":              "./vendor/esm/isomorphic-git_1.27.2_es2022_isomorphic-git.bundle.mjs"
  }
}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0a'/%3E%3Ctext x='50' y='66' font-family='Roboto,Arial,sans-serif' font-size='52' font-weight='700' fill='%23fafafa' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- Empty state when no document loaded -->
<div id="empty-state" class="empty-state">
  <div class="empty-inner">
    <div class="empty-logo"><i data-lucide="code-2"></i></div>
    <h1>CEJ-PAGE</h1>
    <div class="empty-actions">
      <button class="btn btn-primary" id="empty-open-local" title="Ctrl+S grava por cima do próprio arquivo">
        <kbd class="btn-shortcut">A</kbd>
        <i data-lucide="folder-open" class="icon"></i>
        <span>Abrir e editar</span>
        <small>Ctrl+S grava no próprio arquivo</small>
      </button>
      <button class="btn" id="empty-from-act" title="Começar a partir de um ato já publicado no portal">
        <kbd class="btn-shortcut">N</kbd>
        <i data-lucide="file-plus-2" class="icon"></i>
        <span>Novo ato a partir de um ato existente</span>
        <small>Abre um ato do portal e mantém a estrutura</small>
      </button>
      <button class="btn" id="empty-import-url">
        <i data-lucide="globe" class="icon"></i>
        <span>Import from URL</span>
        <small>Edit and save as a local file</small>
      </button>
      <button class="btn" id="empty-new">
        <kbd class="btn-shortcut">C</kbd>
        <i data-lucide="file-plus" class="icon"></i>
        <span>Start Blank</span>
        <small>Empty page</small>
      </button>
      <button class="btn" id="empty-import" title="Abre sem vínculo com o arquivo; salvar vai perguntar onde">
        <kbd class="btn-shortcut">B</kbd>
        <i data-lucide="upload" class="icon"></i>
        <span>Abrir uma cópia</span>
        <small>Sem vínculo — salvar pergunta onde</small>
      </button>
    </div>
    <div class="browser-warning" id="browser-warning" hidden>
      Your browser doesn't support live local file editing (Safari/Firefox). Import/Export still works.
    </div>
  </div>
</div>

<noscript>
  <div class="noscript-fallback">
    <h1>CEJ-PAGE</h1>
    <p>Este editor precisa de JavaScript habilitado para funcionar.</p>
  </div>
</noscript>

<!-- Main editor UI -->
<div id="editor" class="editor" hidden>

  <!-- Top toolbar -->
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand">
        <span class="brand-mark">C</span>
        <span class="brand-text">CEJ-PAGE</span>
      </div>
      <div class="mode-toggle" id="mode-toggle" role="tablist" aria-label="Editor mode">
        <button class="mode-btn active" data-mode="visual" title="Visual editing (may normalize source formatting on save)">
          <i data-lucide="layout-template"></i><span>Visual</span>
        </button>
        <button class="mode-btn" data-mode="source" title="Source editing (byte-for-byte; preserves formatting)">
          <i data-lucide="code-2"></i><span>Source</span>
        </button>
      </div>
      <div class="file-info">
        <span id="file-name" class="file-name">untitled.html</span>
        <span id="save-status" class="save-status" data-state="saved">Saved</span>
        <button id="encoding-chip" class="encoding-chip">UTF-8</button>
      </div>
    </div>

    <div class="toolbar-center">
      <button class="tool-btn icon-only anim-press" id="tb-undo" title="Undo (⌘Z)"><i data-lucide="undo-2"></i></button>
      <button class="tool-btn icon-only anim-press" id="tb-redo" title="Redo (⌘⇧Z)"><i data-lucide="redo-2"></i></button>
      <span class="divider"></span>
      <button class="tool-btn icon-only anim-press" id="tb-duplicate" title="Duplicate (⌘D)"><i data-lucide="copy"></i></button>
      <button class="tool-btn icon-only anim-shake" id="tb-delete" title="Delete (⌫)"><i data-lucide="trash-2"></i></button>
      <span class="divider"></span>
      <button class="tool-btn icon-only anim-press" id="tb-move-up" title="Move up"><i data-lucide="arrow-up"></i></button>
      <button class="tool-btn icon-only anim-press" id="tb-move-down" title="Move down"><i data-lucide="arrow-down"></i></button>
      <button class="tool-btn icon-only anim-press" id="tb-parent" title="Select parent"><i data-lucide="corner-left-up"></i></button>
      <span class="divider"></span>
      <div class="device-toggle">
        <button class="tool-btn icon-only device-btn active" data-device="desktop" title="Desktop"><i data-lucide="monitor"></i></button>
        <button class="tool-btn icon-only device-btn" data-device="tablet" title="Tablet"><i data-lucide="tablet"></i></button>
        <button class="tool-btn icon-only device-btn" data-device="mobile" title="Mobile"><i data-lucide="smartphone"></i></button>
      </div>
      <span class="divider"></span>
      <button class="tool-btn icon-only anim-press active" id="tb-anchors" title="Show where the page's bookmarks are (editor only — never saved)"><i data-lucide="bookmark"></i></button>
      <span class="divider"></span>
      <button class="tool-btn icon-only anim-blink" id="tb-preview" title="Toggle preview mode (P) — hides editor chrome. Scripts don't run inside the editor; use the external preview button for that."><i data-lucide="eye"></i></button>
      <button class="tool-btn icon-only anim-press" id="tb-external-preview" title="Open current document in a new tab (scripts run)"><i data-lucide="external-link"></i></button>
    </div>

    <div class="toolbar-right">
      <button class="tool-btn anim-press" id="tb-open" title="Ctrl+S grava no próprio arquivo"><i data-lucide="folder-open"></i><span>Open</span></button>
      <button class="tool-btn anim-press" id="tb-import" title="Abre sem vínculo com o arquivo"><i data-lucide="upload"></i><span>Import</span></button>
      <button class="tool-btn anim-press" id="tb-import-url" title="Import HTML from URL"><i data-lucide="globe"></i><span>Import URL</span></button>
      <span class="divider"></span>
      <button class="tool-btn primary anim-press" id="tb-save" title="Save (⌘S)"><i data-lucide="save"></i><span>Save</span></button>
      <button class="tool-btn anim-press" id="tb-save-as" title="Save as (Ctrl+Shift+S)"><i data-lucide="file-plus"></i><span>Save as</span></button>
      <button class="tool-btn anim-press" id="tb-export" title="Export HTML"><i data-lucide="download"></i><span>Export</span></button>
      <button class="tool-btn icon-only anim-press" id="tb-assets-dir" title="Link assets folder"><i data-lucide="folder-search"></i></button>
      <span class="divider"></span>
      <button class="tool-btn icon-only anim-press" id="tb-refresh" title="Refresh from disk — pull in external changes" disabled><i data-lucide="refresh-cw"></i></button>
      <button class="tool-btn icon-only anim-press" id="tb-diff" title="Show diff vs. file on disk" disabled><i data-lucide="git-compare-arrows"></i></button>
      <button class="tool-btn icon-only anim-press" id="tb-git-diff" title="Show diff vs. git HEAD (asks for repo directory)" disabled><i data-lucide="git-branch"></i></button>
      <span class="divider"></span>
      <button class="tool-btn lang-toggle" id="tb-lang" title="Trocar idioma para English" aria-label="Trocar idioma para English">EN</button>
      <button class="tool-btn icon-only theme-toggle" id="tb-theme" title="Toggle theme">
        <i data-lucide="sun" class="th-sun"></i>
        <i data-lucide="moon" class="th-moon"></i>
      </button>
    </div>
  </header>

  <!-- Act formatting bar. The vocabulary of a normative act, not of CSS.
       Hidden in source mode and in preview (see editor.css). -->
  <div id="act-bar" class="act-bar" role="toolbar" aria-label="Formatação do ato">
    <div class="act-bar-roles" id="act-bar-roles"></div>
    <span class="act-bar-now" id="act-bar-now"></span>
    <div class="act-bar-tools">
      <button class="tool-btn anim-press" id="act-bar-paste" title="Colar texto copiado do Word (Ctrl+Shift+V)">
        <i data-lucide="clipboard-paste"></i><span>Colar do Word</span>
      </button>
      <button class="tool-btn anim-press" id="act-bar-link" title="Transformar o texto selecionado em link (Ctrl+K)">
        <i data-lucide="link"></i><span>Link</span>
      </button>
      <span class="divider"></span>
      <button class="tool-btn icon-only anim-press" id="act-bar-links" title="Conferir os links da página"><i data-lucide="link-2"></i></button>
      <button class="tool-btn icon-only anim-press" id="act-bar-check" title="Conferência final do ato"><i data-lucide="list-checks"></i></button>
    </div>
  </div>

  <!-- Body: 3-pane -->
  <main class="workspace">

    <!-- Left sidebar -->
    <aside class="sidebar left-sidebar">
      <nav class="sidebar-tabs">
        <button class="tab active" data-tab="outline">Estrutura</button>
        <button class="tab" data-tab="blocks">Peças</button>
        <button class="tab" data-tab="tree">Árvore</button>
        <button class="tab" data-tab="assets">Arquivos</button>
      </nav>

      <!-- Act structure: the document as a legislation person reads it.
           The DOM tree tab stays — it is the escape hatch for a page the
           act recognizer doesn't understand. -->
      <div class="tab-panel active" data-panel="outline">
        <div id="act-outline" class="act-outline"></div>
      </div>

      <!-- Blocks tab -->
      <div class="tab-panel" data-panel="blocks">
        <input type="search" id="blocks-search" class="search-input" placeholder="Search blocks…">
        <div id="blocks-list" class="blocks-list"></div>
      </div>

      <!-- Tree tab -->
      <div class="tab-panel" data-panel="tree">
        <div id="dom-tree" class="dom-tree"></div>
      </div>

      <!-- Assets tab -->
      <div class="tab-panel" data-panel="assets">
        <div class="assets-section">
          <h3>Snippets</h3>
          <p class="hint">Saved blocks of your own</p>
          <button class="btn-block" id="save-snippet" disabled>Save selection as snippet</button>
          <div id="snippets-list" class="snippets-list"></div>
        </div>
        <div class="assets-section">
          <h3>Recent files</h3>
          <div id="recent-list" class="recent-list"></div>
        </div>
      </div>
    </aside>

    <div class="sidebar-gutter left-gutter" data-side="left">
      <button type="button" class="sidebar-toggle" id="left-sidebar-toggle" aria-label="Collapse left sidebar" title="Collapse left sidebar">
        <i data-lucide="chevron-left"></i>
      </button>
    </div>

    <!-- Canvas -->
    <section class="canvas-wrap" id="canvas-wrap">
      <div class="canvas-frame" data-device="desktop">
        <iframe id="canvas" sandbox="allow-same-origin allow-forms" title="Canvas"></iframe>
        <div class="selection-overlay" id="selection-overlay" hidden>
          <div class="sel-box" id="sel-box"></div>
          <div class="sel-label" id="sel-label"></div>
          <div class="sel-toolbar" id="sel-toolbar">
            <button data-action="move-up" title="Move up"><i data-lucide="arrow-up"></i></button>
            <button data-action="move-down" title="Move down"><i data-lucide="arrow-down"></i></button>
            <button data-action="parent" title="Select parent"><i data-lucide="corner-left-up"></i></button>
            <button data-action="duplicate" title="Duplicate"><i data-lucide="copy"></i></button>
            <button data-action="delete" title="Delete"><i data-lucide="trash-2"></i></button>
            <span class="sel-divider" data-context-group="table"></span>
            <button data-action="row-before" data-context-group="table" title="Add row above"><i data-lucide="arrow-up-from-line"></i></button>
            <button data-action="row-after"  data-context-group="table" title="Add row below"><i data-lucide="arrow-down-from-line"></i></button>
            <button data-action="col-before" data-context-group="table" title="Add column before"><i data-lucide="arrow-left-from-line"></i></button>
            <button data-action="col-after"  data-context-group="table" title="Add column after"><i data-lucide="arrow-right-from-line"></i></button>
            <button data-action="row-delete" data-context-group="table" title="Delete row"><i data-lucide="rows-3"></i></button>
            <button data-action="col-delete" data-context-group="table" title="Delete column"><i data-lucide="columns-3"></i></button>
            <span class="sel-divider" data-context-group="list"></span>
            <button data-action="li-before" data-context-group="list" title="Add item above"><i data-lucide="arrow-up-from-line"></i></button>
            <button data-action="li-after"  data-context-group="list" title="Add item below"><i data-lucide="arrow-down-from-line"></i></button>
          </div>
          <div class="hover-box" id="hover-box" hidden></div>
          <div class="drop-indicator" id="drop-indicator" hidden></div>
        </div>
      </div>
    </section>

    <!-- Source mode pane -->
    <section class="source-wrap" id="source-wrap" hidden>
      <div class="source-pane" id="source-pane"></div>
    </section>

    <div class="sidebar-gutter right-gutter" data-side="right">
      <button type="button" class="sidebar-toggle" id="right-sidebar-toggle" aria-label="Collapse right sidebar" title="Collapse right sidebar">
        <i data-lucide="chevron-right"></i>
      </button>
    </div>

    <!-- Right sidebar (properties) -->
    <aside class="sidebar right-sidebar">
      <nav class="sidebar-tabs">
        <button class="tab active" data-tab="piece">Este trecho</button>
        <button class="tab" data-tab="advanced">Avançado</button>
      </nav>

      <!-- Plain-language view of whatever the caret is in. -->
      <div class="tab-panel active" data-panel="piece">
        <div id="piece-panel" class="props"></div>
      </div>

      <!-- The original property editors, untouched — same ids, so
           Properties.init() needs no change. -->
      <div class="tab-panel" data-panel="advanced">
        <nav class="sidebar-tabs sub-tabs">
          <button class="tab active" data-tab="attrs">Atributos</button>
          <button class="tab" data-tab="style">Estilo</button>
          <button class="tab" data-tab="html">HTML</button>
        </nav>
        <div class="tab-panel active" data-panel="attrs">
          <div id="props-attrs" class="props"></div>
        </div>
        <div class="tab-panel" data-panel="style">
          <div id="props-style" class="props"></div>
        </div>
        <div class="tab-panel" data-panel="html">
          <div id="props-html" class="props"></div>
        </div>
      </div>
    </aside>
  </main>

  <!-- Status bar -->
  <footer class="statusbar">
    <a id="version-chip" class="version-chip" href="#" target="_blank" rel="noopener" title="View this commit on GitHub" hidden>
      <i data-lucide="git-commit-horizontal"></i>
      <span class="version-text">—</span>
    </a>
    <span id="status-breadcrumbs" class="breadcrumbs"></span>
    <span class="status-right">
      <span id="status-message"></span>
      <span class="autosave">Autosaved <span id="autosave-time">—</span></span>
    </span>
  </footer>

</div>

<!-- Hidden file inputs -->
<input type="file" id="file-input" accept=".html,.htm" hidden>

<!-- Floating exit-preview button -->
<button id="exit-preview-btn" class="exit-preview-btn" hidden>← Exit preview (P or Esc)</button>

<!-- Toast container -->
<div id="toasts" class="toasts"></div>

<!-- Scripts -->
<script src="js/i18n.js"></script>
<script src="js/traces.js"></script>
<script src="js/dialog.js"></script>
<script src="js/state.js"></script>
<script src="js/act-format.js"></script>
<script src="js/blocks.js"></script>
<script src="js/asset-resolver.js"></script>
<script src="js/canvas.js"></script>
<script src="js/page-tools.js"></script>
<script src="js/paste-word.js"></script>
<script src="js/link-tool.js"></script>
<script src="js/act-check.js"></script>
<script src="js/tree.js"></script>
<script src="js/outline-panel.js"></script>
<script src="js/properties.js"></script>
<script src="js/piece-panel.js"></script>
<script src="js/blocks-panel.js"></script>
<script src="js/act-bar.js"></script>
<script src="js/source.js"></script>
<script src="js/mode-switch.js"></script>
<script src="js/encoding.js"></script>
<script src="js/file.js"></script>
<script src="js/act-template.js"></script>
<script src="js/diff.js"></script>
<script src="js/git.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/editor.js"></script>
<script src="js/version.js"></script>

</body>
</html>
