name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      # O binário do Electron não é usado aqui: o esbuild empacota a camada
      # desktop com --external:electron, e o tsc só precisa das tipagens, que
      # vêm no pacote npm. Baixá-lo custava um minuto e derrubava a integração
      # sempre que o servidor de releases do Electron fechava a conexão.
      - name: Install Dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Unit Tests
        run: npm test

      # Cobre a verificação de tipos (tsc), o empacotamento web (vite) e os
      # scripts da camada Electron (esbuild) — tudo menos o electron-builder,
      # que roda por sistema operacional apenas na publicação de uma versão.
      - name: Build (tipos, web e Electron)
        run: npm run build
