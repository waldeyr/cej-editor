name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Unit Tests
        run: npm test

      # Cobre a verificação de tipos (tsc), o empacotamento web (vite) e os
      # scripts da camada Electron (esbuild) — tudo menos o electron-builder,
      # que roda por sistema operacional apenas na publicação de uma versão.
      - name: Build (tipos, web e Electron)
        run: npm run build
