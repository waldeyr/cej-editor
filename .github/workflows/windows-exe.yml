name: Build Windows executable

# Manual, plus automatic on a version tag. The .exe is what non-technical
# users install, so it should be produced deliberately, not on every push.
on:
  workflow_dispatch:
  push:
    # A glob, not a hand-kept list: every release used to need this file edited
    # first, and a forgotten entry means the tag builds nothing.
    # Matches 0.5, 1.0, v0.5, v1.0-rc1.
    tags: ['[0-9]*', 'v[0-9]*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # The launcher is stdlib-only: no go.sum exists, so there is
          # nothing to cache and the default lookup only emits a warning.
          cache: false

      - name: Work out the version
        id: ver
        # A user with two downloads in their Downloads folder has to be able to
        # tell them apart, and a bug report has to name a build. On a tag that
        # is the tag itself; on a manual run there is no version, so the short
        # SHA stands in rather than producing a second file called v.exe.
        run: |
          REF="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${REF#v}"            # 'v0.5' and '0.5' both give '0.5'
            NAME="cej-page-v${VERSION}"
          else
            VERSION="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            NAME="cej-page-${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"       >> "$GITHUB_OUTPUT"
          echo "exe=dist/${NAME}.exe" >> "$GITHUB_OUTPUT"
          echo "building ${NAME}.exe"

      - name: Build the executable
        run: |
          chmod +x tools/launcher/build.sh
          ./tools/launcher/build.sh
          mv dist/CEJ-PAGE.exe "${{ steps.ver.outputs.exe }}"
          ls -la dist/

      - name: Confirm the site was embedded
        # A missing vendor/ directory would still compile and then fail at
        # runtime on a machine with no network — exactly the case the
        # executable exists to serve. Catch it here instead.
        run: |
          for f in index.html js/encoding.js vendor/lucide.min.js vendor/roboto.css; do
            test -f "tools/launcher/site/$f" || { echo "missing from bundle: $f"; exit 1; }
          done
          ls -la dist/

      - name: Every vendored module must have a JS extension
        # Browsers refuse `import` from a response whose Content-Type isn't a
        # JavaScript MIME type, and servers derive that from the extension.
        # An extensionless file here only breaks the lazily-loaded features
        # (source mode, diff, git), so it survives a casual smoke test.
        run: |
          bad=$(find vendor/esm -type f ! -name '*.mjs' ! -name '*.js' || true)
          if [ -n "$bad" ]; then echo "not served as JavaScript:"; echo "$bad"; exit 1; fi
          echo "all $(find vendor/esm -type f | wc -l) modules are .mjs/.js"

      - name: No remote references may remain
        # The whole point of vendoring: the executable must work with the
        # network unplugged.
        run: |
          if grep -rnE 'https?://(unpkg|esm\.sh|fonts\.(googleapis|gstatic))' \
               tools/launcher/site/index.html tools/launcher/site/css tools/launcher/site/js; then
            echo "the bundle still reaches a CDN"; exit 1
          fi
          echo "bundle is self-contained"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.name }}
          path: ${{ steps.ver.outputs.exe }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.exe }}
          body: |
            ## CEJ-PAGE ${{ steps.ver.outputs.version }} — executável para Windows

            Baixe o `${{ steps.ver.outputs.name }}.exe` abaixo e dê duplo
            clique. Não precisa instalar nada, nem ter internet.

            Na primeira execução o Windows pode exibir "O Windows protegeu o
            seu computador", porque o arquivo não tem assinatura digital paga.
            Clique em **Mais informações** → **Executar assim mesmo**.

            Para encerrar o programa, feche a janela preta.
