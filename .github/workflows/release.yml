name: CEJ-EDITOR Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Tag da release que recebe os instaladores (ex.: v0.2.3). Deixe em
          branco só para conferir que o empacotamento ainda compila — nenhuma
          release é tocada nesse caso.
        required: false
        type: string

jobs:
  build:
    name: Build Standalone Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # O publish embutido do electron-builder escolhe a release pela versão
      # do package.json, não pela tag que disparou o workflow — e quando as
      # duas divergem ele publica (ou cria) a release errada sem avisar (foi
      # assim que nasceu a release solta "v1.0.0", com um único instalador).
      # Por isso o próprio script build:desktop traz "--publish never" (passar
      # a flag daqui via "npm run -- --publish never" chega fora de ordem ao
      # electron-builder e derruba o build com "Unknown argument: never").
      # Quem decide para qual release os instaladores vão é o job "publish",
      # pela tag de verdade.
      - name: Build Web Application & Desktop Executables
        run: npm run build:desktop

      # Só os instaláveis. O diretório dist-desktop guarda também a árvore
      # descompactada do aplicativo e os metadados de auto-update
      # (latest*.yml, .blockmap), que este programa não usa e não interessam
      # a ninguém.
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cej-editor-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb

  publish:
    name: Anexar instaladores à release
    needs: build
    # Dispara em duas situações: tag empurrada (publica na própria tag) ou
    # disparo manual com a tag de destino (republica uma release já
    # existente). Disparo manual sem tag é só a prova de que empacota — não
    # deve tocar release nenhuma.
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Reunir todos os instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: cej-editor-desktop-*
          path: release-assets
          merge-multiple: true

      # A release nasce aqui quando ainda não existe: a tag por si só não a
      # cria, e o `gh release upload` recusa anexar ao que não há.
      - name: Anexar à release, criando-a se não existir
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
                 --notes "CEJ-EDITOR $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
