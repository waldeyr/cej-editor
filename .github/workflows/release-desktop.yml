name: Publicar instaladores desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag da release que receberá os instaladores
        required: true
        type: string

permissions:
  contents: write

jobs:
  empacotar:
    name: Empacotar (${{ matrix.nome }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: macos
          - os: windows-latest
            nome: windows
          - os: ubuntu-latest
            nome: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:desktop -- --publish never

      - name: Guardar os pacotes de ${{ matrix.nome }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.nome }}
          path: dist-desktop/*
          if-no-files-found: error

  publicar:
    name: Anexar instaladores à release
    needs: empacotar
    runs-on: ubuntu-latest
    steps:
      - name: Reunir todos os pacotes
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Anexar à release existente
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
